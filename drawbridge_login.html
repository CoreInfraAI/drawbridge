<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Drawbridge Login</title>
  </head>
  <body>
    <h1>Drawbridge Login</h1>
    <p>Sign in to access internal services.</p>
    <p>
      <button id="login">Sign in</button>
    </p>

    <script>
      const $ = (id) => document.getElementById(id);

      async function postJSON(url, body) {
        console.log(`> ${url}`, body);
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        if (!res.ok) {
          throw new Error(`HTTP ${res.status} from ${url}`);
        }
        let resp = await res.json();
        console.log(`< ${url}`, resp);
        return resp;
      }

      function getNextParam() {
        const u = new URL(window.location.href);
        const next = u.searchParams.get("next");
        return next ? String(next) : "";
      }

      $("login").addEventListener("click", async () => {
        if (!window.PublicKeyCredential?.parseRequestOptionsFromJSON ||
            !PublicKeyCredential.prototype.toJSON) {
          window.alert("Please use an up-to-date browser with passkey support.");
          return;
        }

        try {
          $("login").disabled = true;

          const options = await postJSON("/assertion/begin", {});
          options.hints = ["client-device", "security-key"];

          const getParams = {
            publicKey: PublicKeyCredential.parseRequestOptionsFromJSON(options),
          };
          const cred = await navigator.credentials.get(getParams);
          if (!cred) {
            throw new Error("navigator.credentials.get() returned null");
          }

          const finishPayload = {
            credential: cred,
            next: getNextParam(),
          };
          const resp = await postJSON("/assertion/finish", finishPayload);
          const redirectTo = resp.redirect_to ? String(resp.redirect_to) : "";
          if (redirectTo) {
            window.location = redirectTo;
          } else {
            window.location = "/";
          }
        } catch (e) {
          const msg = String(e && e.message ? e.message : e);
          window.alert(msg);
        } finally {
          $("login").disabled = false;
        }
      });
    </script>
  </body>
</html>
